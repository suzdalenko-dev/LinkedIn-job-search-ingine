    <style>
        :root {
            --blue: #0a66c2;
            --blue-dark: #004182;
            --text: #191919;
            --muted: #666;
            --line: #ddd;
            --bg: #f3f2ef;
            --green: #057642
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif
        }

        a {
            color: var(--blue);
            text-decoration: none
        }

        a:hover {
            text-decoration: underline
        }

        button,
        input {
            font: inherit
        }

        button {
            cursor: pointer
        }

        .topbar {
            height: 56px;
            background: #fff;
            border-bottom: 1px solid #ddd;
            position: sticky;
            top: 0;
            z-index: 10
        }

        .nav {
            max-width: 1260px;
            height: 100%;
            margin: auto;
            padding: 0 18px;
            display: flex;
            align-items: center;
            gap: 10px

        .brand {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 218px;
            height: 28px;
            background: var(--blue);
            color: #fff;
            border-radius: 3px;
            font-size: 22px;
            font-weight: 750;
            letter-spacing: -1px
        }

        .search {
            height: 32px;
            width: min(390px, 34vw);
            border: 1px solid #ddd;
            border-radius: 18px;
            background: #fff;
            padding: 0 14px;
            outline: 0
        }

        .search:focus {
            border-color: #777;
            background: #f7f9fa
        }

        .navlinks {
            margin-left: auto;
            display: flex;
            height: 100%;
            align-items: stretch
        }

        .navlink {
            min-width: 56px;
            padding: 5px 8px 3px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #555;
            font-size: 10px;
            border-bottom: 2px solid transparent;
            white-space: nowrap
        }

        .navlink .ico {
            font-size: 20px;
            line-height: 24px
        }

        .navlink.active {
            border-bottom-color: #191919;
            color: #191919
        }

        .navlink.premium {
            color: #805500;
            text-decoration: underline;
            max-width: 86px;
            white-space: normal;
            text-align: center
        }

        .miniavatar {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            background: #e0e8ed;
            color: #294b61;
            font-size: 10px
        }

        .filters {
            background: #fff;
            border-bottom: 1px solid #ddd;
            padding: 10px 0
        }

        .filterinner {
            max-width: 1260px;
            margin: auto;
            padding: 0 18px;
            display: flex;
            gap: 7px;
            flex-wrap: wrap
        }

        .filter {
            background: white;
            border: 1px solid #777;
            border-radius: 18px;
            padding: 5px 12px;
            color: #333;
            font-size: 12px
        }

        .filter.active {
            background: #e8f3ff;
            border-color: var(--blue);
            color: var(--blue)
        }

        .layout {
            max-width: 1260px;
            margin: 0 auto;
            padding: 0 18px;
            display: grid;
            grid-template-columns: 350px minmax(0, 1fr);
            gap: 16px;
            height: calc(100vh - 112px);
            min-height: 600px
        }

        .results {
            overflow: auto;
            min-width: 0;
            border-right: 1px solid #ddd;
            padding-right: 8px
        }

        .resultshead {
            padding: 14px 8px 12px
        }

        .resultshead h2 {
            font-size: 16px;
            margin: 0 0 3px;
            font-weight: 600
        }

        .resultshead p {
            font-size: 11px;
            color: #666;
            margin: 0
        }

        .result {
            position: relative;
            padding: 12px 8px 12px 10px;
            border-bottom: 1px solid #ddd;
            display: grid;
            grid-template-columns: 42px minmax(0, 1fr) 20px;
            gap: 8px;
            background: #fff;
            cursor: pointer
        }

        .result:hover {
            background: #f5faff
        }

        .result.selected {
            background: #eef3f8;
            border-left: 2px solid #191919;
            padding-left: 8px
        }

        .logo {
            width: 38px;
            height: 38px;
            border: 1px solid #eee;
            border-radius: 3px;
            background: #e5edf4;
            display: grid;
            place-items: center;
            color: #315c7c;
            font-size: 14px;
            font-weight: 700
        }

        .result h3 {
            font-size: 13px;
            color: var(--blue);
            font-weight: 600;
            line-height: 1.3;
            margin: 0 0 2px
        }

        .result .company {
            font-size: 11px;
            margin-bottom: 2px
        }

        .result .loc,
        .result .small {
            font-size: 10px;
            color: #666;
            margin-top: 2px
        }

        .result .menu {
            border: 0;
            background: none;
            color: #555;
            font-size: 18px;
            padding: 0;
            align-self: start
        }

        .result .promoted {
            font-size: 10px;
            color: #666;
            margin-top: 3px
        }

        .detail {
            overflow: auto;
            min-width: 0;
            background: white;
            border-left: 1px solid #ddd;
            border-right: 1px solid #ddd
        }

        .detailhead {
            padding: 22px 22px 20px;
            border-bottom: 1px solid #eee
        }

        .companyrow {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px
        }

        .companylogo {
            width: 28px;
            height: 28px;
            border-radius: 2px;
            background: #e1edf4;
            color: #245878;
            font-weight: 700;
            display: grid;
            place-items: center
        }

        .companyname {
            font-size: 12px;
            font-weight: 500
        }

        .more {
            margin-left: auto;
            border: 0;
            background: transparent;
            font-size: 22px;
            color: #666
        }

        h1 {
            font-size: 20px;
            line-height: 1.3;
            margin: 0 0 5px;
            font-weight: 650
        }

        .verify {
            font-size: 12px;
            color: #666
        }

        .meta {
            color: #666;
            font-size: 11px;
            margin: 5px 0
        }

        .chips {
            display: flex;
            gap: 7px;
            flex-wrap: wrap;
            margin: 12px 0
        }

        .chip {
            border: 1px solid #aaa;
            border-radius: 18px;
            padding: 4px 10px;
            font-size: 11px
        }

        .actions {
            display: flex;
            gap: 8px;
            margin-top: 12px
        }

        .btn {
            border: 1px solid var(--blue);
            border-radius: 18px;
            background: #fff;
            color: var(--blue);
            font-weight: 600;
            padding: 5px 14px;
            font-size: 12px
        }

        .btn.primary {
            background: var(--blue);
            color: #fff
        }

        .btn.primary:hover {
            background: var(--blue-dark)
        }

        .btn.saved {
            background: #e8f3ff
        }

            border: 1px solid #ddd;
            border-radius: 7px;
            padding: 18px;
            margin: 18px 0 12px
        }

        .alerttitle {
            font-size: 16px;
            font-weight: 600;
            line-height: 1.35;
            margin-bottom: 10px;
            max-width: 500px
        }

            background: #fff;
            border-radius: 12px;
            padding: 10px 14px;
            color: #444
        }

        .beta {
            font-size: 10px;
            color: #777;
            margin-top: 12px;
            display: flex;
            justify-content: space-between;
            gap: 12px
        }

            border: 1px solid #ddd;
            border-radius: 7px;
            padding: 18px;
            margin: 12px 0 24px
        }

            font-size: 13px;
            line-height: 1.4;
            margin: 0 0 8px
        }

        .premium-box p {
            font-size: 11px;
            color: #666;
            margin: 0 0 9px
        }

        .premium-link {
            font-size: 11px;
            font-weight: 600
        }

        .jobbody {
            padding: 0 22px 24px
        }

        .jobbody h2 {
            font-size: 16px;
            margin: 0 0 8px;
            font-weight: 600
        }

        .jobbody p {
            margin: 0 0 12px
        }

        .jobbody h3 {
            font-size: 14px;
            margin: 18px 0 7px
        }

        .jobbody ul {
            margin: 6px 0 16px;
            padding-left: 20px
        }

        .jobbody li {
            margin: 5px 0
        }

        .jobsummary {
            font-size: 12px;
            line-height: 1.55
        }

        .companyabout {
            border-top: 1px solid #eee;
            margin-top: 24px;
            padding-top: 18px
        }

        .companyhead {
            display: flex;
            align-items: center;
            gap: 12px
        }

        .companyhead .companylogo {
            width: 46px;
            height: 46px;
            font-size: 18px
        }

        .companyabout h3 {
            margin: 0 0 4px;
            font-size: 16px
        }

        .companyabout .muted {
            font-size: 11px;
            color: #666
        }

        .companyabout p {
            margin: 12px 0;
            font-size: 12px
        }

        .companyfacts {

            gap: 22px;
            flex-wrap: wrap;
            color: #666;
            font-size: 11px;
            border-top: 1px solid #eee;
            padding-top: 12px
        }

        .footer {
            padding: 16px 22px;
            color: #666;
            font-size: 10px;
            text-align: center
        }

        .toast {
            position: fixed;
            bottom: 22px;
            left: 50%;
            transform: translateX(-50%);
            background: #222;
            color: #fff;
            padding: 12px 18px;
            border-radius: 7px;
            display: none;
            z-index: 30;
            max-width: 90%;
            box-shadow: 0 3px 14px #0003
        }

        @media(max-width:900px) {
            .layout {
                grid-template-columns: 300px minmax(0, 1fr);
                gap: 10px
            }

            .search {
                width: 230px
            }

            .navlink {
                min-width: 45px;
                padding-left: 4px;
                padding-right: 4px
            }

            .navlink.premium {
                display: none
            }
        }

        @media(max-width:680px) {
            .nav {
                gap: 7px
            }

            .search {
                width: 100%;
                min-width: 0
            }

            .searchwrap {
                flex: 1;
                min-width: 0
            }

            .navlink:nth-child(n+4) {
                display: none
            }

            .layout {
                display: block;
                height: auto;
                min-height: 0;
                padding: 0 8px
            }

            .results {
                display: none
            }

            .detail {
                height: auto;
                overflow: visible
            }

            .detailhead {
                padding: 18px 14px
            }

            .jobbody {
                padding: 0 14px 20px
            }

            .premium-box,
            .alertbox {
                padding: 13px
            }

            .navlink {
                min-width: 38px
            }

            .filters {
                padding: 8px 0
            }

            .filterinner {
                padding: 0 8px
            }
        }
    </style>
</head>
